name: Dependabot auto-merge

on: pull_request

jobs:
  metadata:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    outputs:
      update-type: ${{ steps.metadata.outputs.update-type }}
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

  auto-merge:
    needs: metadata
    # Major/breaking bumps (a new tailwindcss, next, glob major, etc.) need a
    # human to actually verify the build still works — see #54/#56. Only
    # minor/patch updates are safe to fast-track.
    if: needs.metadata.outputs.update-type != 'version-update:semver-major'
    uses: DoubtfulTurnip/.github/.github/workflows/dependabot-auto-merge.yml@main
    permissions:
      contents: write
      pull-requests: write
